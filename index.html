<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Canan Geri Sayım</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:white;
  font-family:Georgia, serif;
}

/* Başlık */
#title{
  font-size:42px;
  font-weight:bold;
  margin-bottom:20px;
}

/* HAYIR */
#hayir{
  font-size:60px;
  font-weight:bold;
  color:red;
  display:none;
  margin-bottom:20px;
  animation:heartbeat 1s infinite;
}

/* Kalp atışı efekti */
@keyframes heartbeat{
  0%   { transform:scale(1); opacity:1; }
  25%  { transform:scale(1.2); opacity:0.7; }
  40%  { transform:scale(1); opacity:1; }
  60%  { transform:scale(1.2); opacity:0.7; }
  100% { transform:scale(1); opacity:1; }
}

/* Geri sayım */
#countdown{
  font-size:30px;
  margin-bottom:35px;
}

/* Play buton */
#playButton{
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  margin-bottom:35px;
  user-select:none;
}
</style>
</head>

<body>

<div id="title">CANAN BİRİNİ BULDU MU?</div>

<div id="hayir">HAYIR</div>

<div id="countdown">Yükleniyor...</div>

<!-- PLAY / PAUSE -->
<div id="playButton">
  <div id="iconPlay"></div>
  <span id="playText" style="font-size:18px;">play</span>
</div>

<!-- GIF -->
<img id="gif" src="gif.gif" style="max-width:320px; display:none;">

<!-- SES -->
<audio id="music" src="music.mp3"></audio>

<script>
/******** GERİ SAYIM ********/
const startTime = new Date(2026,1,9,15,0,0);   // 09 Şubat 2026 15:00
const endTime   = new Date(2026,7,31,15,0,0);  // 31 Ağustos 2026 15:00

const countdownEl = document.getElementById("countdown");

function updateCountdown(){
  const now = new Date();
  let diff = now < startTime ? startTime - now : endTime - now;
  if(diff < 0) diff = 0;

  const totalSeconds = Math.floor(diff/1000);
  const days = Math.floor(totalSeconds/86400);
  const hours = Math.floor((totalSeconds%86400)/3600);
  const minutes = Math.floor((totalSeconds%3600)/60);
  const seconds = totalSeconds%60;

  countdownEl.innerText =
    `${days} : ${hours.toString().padStart(2,"0")} : ` +
    `${minutes.toString().padStart(2,"0")} : ${seconds.toString().padStart(2,"0")}`;
}

updateCountdown();
setInterval(updateCountdown,1000);


/******** 1 SANİYE SONRA HAYIR ********/
setTimeout(()=>{
  document.getElementById("hayir").style.display="block";
},1000);


/******** 2 SANİYE SONRA GIF ********/
setTimeout(()=>{
  document.getElementById("gif").style.display="block";
},2000);


/******** PLAY / PAUSE ********/
const music = document.getElementById("music");
const playButton = document.getElementById("playButton");
const icon = document.getElementById("iconPlay");
const text = document.getElementById("playText");
let isPlaying = false;

music.volume = 0.5;

function renderIcon(){
  if(isPlaying){
    icon.innerHTML = `
      <div style="display:flex; gap:6px;">
        <div style="width:6px;height:20px;background:black;"></div>
        <div style="width:6px;height:20px;background:black;"></div>
      </div>
    `;
    text.innerText="pause";
  }else{
    icon.innerHTML = `
      <div style="
        width:0;
        height:0;
        border-left:18px solid black;
        border-top:10px solid transparent;
        border-bottom:10px solid transparent;
      "></div>
    `;
    text.innerText="play";
  }
}

renderIcon();

playButton.addEventListener("click",()=>{
  if(!isPlaying){
    music.play();
    isPlaying=true;
  }else{
    music.pause();
    isPlaying=false;
  }
  renderIcon();
});

window.addEventListener("beforeunload",()=>{
  music.pause();
});
</script>

</body>
</html>
